[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litgraph-agent"
version = "1.0.0"
description = "Autonomous Literature Research Agent with Obsidian Knowledge Graph Synthesis"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LitGraphAgent Contributors" }
]
keywords = ["obsidian", "literature-review", "knowledge-graph", "ai-agent", "deepseek", "arxiv", "zettelkasten"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.3,<0.4",
    "openai>=1.30.0",
    "arxiv>=2.1.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "urllib3>=2.2.0",
    "pypdf>=4.2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[project.urls]
Repository = "https://github.com/Icold21/LitGraphAgent"

[project.scripts]
litgraph = "lit_graph.cli:main"

[tool.setuptools.packages.find]
include = ["lit_graph*"]
exclude = ["vaults*", "tests*"]

[tool.setuptools.package-data]
"lit_graph" = ["**/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E722"]
